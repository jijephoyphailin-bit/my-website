<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LIFE OS — Personal Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0b0f;color:#e8eaf0;font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0b0f}
::-webkit-scrollbar-thumb{background:#2a3040;border-radius:2px}
input,textarea,select{background:#0a0b0f;border:1px solid #1e2330;color:#e8eaf0;font-family:'Syne',sans-serif;font-size:13px;padding:8px 12px;border-radius:6px;outline:none;width:100%;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#00d4ff}
textarea{resize:vertical;min-height:72px}
button{cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;transition:all .2s}
label{font-size:11px;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;display:block}
h1,h2,h3,h4{font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:slideIn .3s ease forwards}
input[type=range]{padding:0;border:none;background:transparent}
input[type=checkbox]{width:16px;height:16px;flex-shrink:0}
input[type=file]{font-size:11px;padding:6px 8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useCallback,useRef} = React;
const {
  BarChart,Bar,LineChart,Line,XAxis,YAxis,Tooltip,
  ResponsiveContainer,RadarChart,Radar,PolarGrid,
  PolarAngleAxis,PieChart,Pie,Cell
} = Recharts;

const C = {
  bg:"#0a0b0f",surface:"#111318",card:"#161a22",border:"#1e2330",
  accent:"#00d4ff",gold:"#f5c842",green:"#00e676",red:"#ff3d57",
  yellow:"#ffd600",purple:"#b388ff",text:"#e8eaf0",muted:"#6b7280",dim:"#2a3040"
};

const todayStr = () => new Date().toISOString().split("T")[0];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function useLS(key, def) {
  const [v,setV] = useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch{return def;}});
  const save = useCallback((val)=>{const next=typeof val==="function"?val(v):val;setV(next);localStorage.setItem(key,JSON.stringify(next));},[key,v]);
  return [v,save];
}

function calcScore(r,j){
  let s=0,max=0;
  const add=(val,pts)=>{max+=pts;if(val)s+=pts;};
  add(r.prayer,10);add(r.bibleReading,10);add(r.gratitude,5);
  add(r.weights||r.cardio,15);add(r.drinkWater,5);add(r.makeBed,3);
  add(r.noSocialMedia,7);add(j&&j.proteinGoal,10);add(j&&j.caloriesGoal,5);
  add((j&&j.tradingHours||0)>=1,10);add((j&&j.chineseHours||0)>=1,10);
  add(j&&(j.sleepQuality||0)>=7,5);add(r.reflection,5);
  return max>0?Math.round((s/max)*100):0;
}

// ── UI ATOMS ──
const Card=({children,style={},className=""})=>React.createElement("div",{className:"slide-in "+className,style:{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:20,...style}},children);
const CT=({icon,title,color=C.accent})=>React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:16}},[
  React.createElement("span",{key:"i",style:{color,fontSize:16}},icon),
  React.createElement("span",{key:"t",style:{fontSize:13,fontWeight:700,color,letterSpacing:".08em",textTransform:"uppercase"}},title)
]);
const Pill=({children,color=C.accent})=>React.createElement("span",{style:{background:color+"22",color,border:"1px solid "+color+"44",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600}},children);
const PBar=({value,max=100,color=C.accent,label,showPct=true})=>React.createElement("div",{style:{marginBottom:8}},[
  label&&React.createElement("div",{key:"lbl",style:{display:"flex",justifyContent:"space-between",marginBottom:4}},[
    React.createElement("span",{key:"l",style:{fontSize:12,color:C.muted}},label),
    showPct&&React.createElement("span",{key:"p",style:{fontSize:12,color,fontFamily:"JetBrains Mono"}},Math.round((value/max)*100)+"%")
  ]),
  React.createElement("div",{key:"track",style:{background:C.dim,borderRadius:4,height:6,overflow:"hidden"}},
    React.createElement("div",{style:{width:Math.min((value/max)*100,100)+"%",background:color,height:"100%",borderRadius:4,transition:"width .5s ease"}})
  )
]);
const Btn=({onClick,children,color=C.accent,style={}})=>React.createElement("button",{onClick,style:{background:color,color:"#000",border:"1px solid "+color,borderRadius:7,padding:"8px 16px",fontSize:12,fontWeight:700,...style}},children);

// ── DASHBOARD ──
function DashboardHome({journal,routine,goals}){
  const k=todayStr();
  const j=journal[k]||{};const r=routine[k]||{};
  const score=calcScore(r,j);
  const sc=score>=90?C.green:score>=75?C.accent:score>=60?C.yellow:C.red;
  const sl=score>=90?"EXCELLENT":score>=75?"GOOD":score>=60?"AVERAGE":"POOR";
  const week=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(6-i));
    const dk=d.toISOString().split("T")[0];
    return{name:DAYS[d.getDay()],score:calcScore(routine[dk]||{},journal[dk]||{})};
  });
  const times=[
    {name:"Trading",hours:j.tradingHours||0,color:C.gold},
    {name:"Chinese",hours:j.chineseHours||0,color:C.accent},
    {name:"English",hours:j.englishHours||0,color:C.purple},
    {name:"AI/Biz",hours:j.aiHours||0,color:C.green},
    {name:"Workout",hours:j.workoutHours||0,color:C.red},
    {name:"Social",hours:j.socialHours||0,color:C.muted},
  ].filter(d=>d.hours>0).sort((a,b)=>b.hours-a.hours);
  const GOALS=[
    {key:"sixpack",label:"Six Pack",color:C.red},
    {key:"funded",label:"$100K Funded",color:C.gold},
    {key:"withdrawal",label:"$10K Withdrawal",color:C.green},
    {key:"hsk",label:"HSK 5/6",color:C.accent},
    {key:"bible",label:"Closer to God",color:C.purple},
  ];
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}},[
    // Score card
    React.createElement(Card,{key:"score",style:{gridColumn:"1/-1",background:"linear-gradient(135deg,"+C.card+","+C.surface+")"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:16}},[
        React.createElement("div",{key:"left"},[
          React.createElement("div",{key:"lbl",style:{fontSize:11,color:C.muted,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}},"Today's Life Score — "+k),
          React.createElement("div",{key:"num",style:{fontSize:72,fontWeight:800,color:sc,lineHeight:1,fontFamily:"JetBrains Mono"}},score),
          React.createElement(Pill,{key:"pill",color:sc},sl)
        ]),
        React.createElement("div",{key:"chart",style:{flex:1,minWidth:200,height:80}},
          React.createElement(ResponsiveContainer,{width:"100%",height:"100%"},
            React.createElement(LineChart,{data:week},[
              React.createElement(Line,{key:"l",type:"monotone",dataKey:"score",stroke:C.accent,strokeWidth:2,dot:false}),
              React.createElement(XAxis,{key:"x",dataKey:"name",tick:{fill:C.muted,fontSize:11},axisLine:false,tickLine:false}),
              React.createElement(Tooltip,{key:"t",contentStyle:{background:C.card,border:"1px solid "+C.border,borderRadius:8}})
            ])
          )
        )
      ])
    ),
    // Vision
    React.createElement(Card,{key:"vision",style:{background:"linear-gradient(135deg,#0d1117,#161a22)",border:"1px solid "+C.gold+"33"}},
      [React.createElement(CT,{key:"ct",icon:"✦",title:"My Vision",color:C.gold}),
      React.createElement("div",{key:"list",style:{fontSize:13,lineHeight:1.8}},
        ["Close to God","Disciplined","Mentally Strong","Financially Wise","Healthy","Business Minded","Multilingual","Peaceful"].map(v=>
          React.createElement("div",{key:v,style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},[
            React.createElement("span",{key:"a",style:{color:C.gold}},"→"),v
          ])
        )
      ),
      React.createElement("div",{key:"quote",style:{marginTop:16,padding:"12px 16px",background:C.gold+"11",borderLeft:"3px solid "+C.gold,borderRadius:4,fontSize:12,color:C.gold,fontStyle:"italic"}},
        '"Am I becoming the person I said I wanted to become?"'
      )]
    ),
    // Time today
    React.createElement(Card,{key:"time"},
      [React.createElement(CT,{key:"ct",icon:"⏱",title:"Time Today",color:C.accent}),
      times.length===0?
        React.createElement("div",{key:"empty",style:{color:C.muted,fontSize:12}},"No time logged yet. Update your Journal."):
        times.map((d,i)=>
          React.createElement("div",{key:d.name,style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},[
            React.createElement("div",{key:"n",style:{width:24,fontSize:11,color:C.muted,fontFamily:"JetBrains Mono"}},"#"+(i+1)),
            React.createElement("div",{key:"nm",style:{flex:1,fontSize:13}},d.name),
            React.createElement("div",{key:"h",style:{fontFamily:"JetBrains Mono",fontSize:12,color:d.color,minWidth:48,textAlign:"right"}},d.hours+"h"),
            React.createElement("div",{key:"bar",style:{width:80,background:C.dim,borderRadius:3,height:5}},
              React.createElement("div",{style:{width:(d.hours/(times[0]?.hours||1))*100+"%",background:d.color,height:"100%",borderRadius:3}})
            )
          ])
        )
      ]
    ),
    // Goals
    React.createElement(Card,{key:"goals"},
      [React.createElement(CT,{key:"ct",icon:"🎯",title:"2026 Goals",color:C.green}),
      GOALS.map(g=>React.createElement(PBar,{key:g.key,label:g.label,value:goals[g.key]||0,max:100,color:g.color}))
      ]
    ),
    // Fears
    React.createElement(Card,{key:"fears",style:{border:"1px solid "+C.red+"33"}},
      [React.createElement(CT,{key:"ct",icon:"⚡",title:"Remember Your Fears",color:C.red}),
      ["Wasting my potential","Being lazy","Financial failure","Emotional trading","Not reaching my goals","Drifting from God"].map(f=>
        React.createElement("div",{key:f,style:{display:"flex",gap:8,marginBottom:6,fontSize:12,color:C.muted}},[
          React.createElement("span",{key:"a",style:{color:C.red}},"▸"),f
        ])
      )]
    )
  ]);
}

// ── ROUTINE ──
const ROUTINE=[
  {time:"06:30",label:"Wake Up",items:[{key:"drinkWater",label:"Drink Water"},{key:"makeBed",label:"Make Bed"},{key:"noSocialMedia",label:"No Social Media"}]},
  {time:"06:40",label:"God Time",items:[{key:"prayer",label:"Prayer"},{key:"bibleReading",label:"Bible Reading"},{key:"gratitude",label:"Gratitude"}]},
  {time:"07:00",label:"Workout",items:[{key:"weights",label:"Weights"},{key:"cardio",label:"Cardio"}]},
  {time:"08:00",label:"Breakfast",items:[{key:"healthyBreakfast",label:"Healthy Breakfast"}]},
  {time:"09:00",label:"Trading Study",items:[{key:"tradingStudy",label:"Trading Study"}]},
  {time:"13:00",label:"Language",items:[{key:"chineseStudy",label:"Chinese Study"},{key:"englishStudy",label:"English Study"}]},
  {time:"15:00",label:"Learning",items:[{key:"aiLearning",label:"AI Learning"},{key:"businessLearning",label:"Business Learning"}]},
  {time:"17:00",label:"Walking",items:[{key:"walking",label:"Walking"}]},
  {time:"21:00",label:"Night",items:[{key:"reflection",label:"Reflection"},{key:"nightPrayer",label:"Night Prayer"}]},
  {time:"22:00",label:"Sleep",items:[{key:"sleep",label:"Sleep on time"}]},
];

function RoutinePage({routine,setRoutine}){
  const k=todayStr();const r=routine[k]||{};
  const toggle=f=>setRoutine(p=>({...p,[k]:{...(p[k]||{}),[f]:!((p[k]||{})[f])}}));
  const all=ROUTINE.flatMap(s=>s.items);
  const done=all.filter(i=>r[i.key]).length;
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:16}},[
    React.createElement(Card,{key:"hdr",style:{gridColumn:"1/-1"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},[
        React.createElement("div",{key:"info"},[
          React.createElement("div",{key:"sub",style:{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:".08em"}},"Today's Routine"),
          React.createElement("div",{key:"num",style:{fontSize:28,fontWeight:800,color:C.accent,fontFamily:"JetBrains Mono"}},done+"/"+all.length+" ",React.createElement("span",{style:{fontSize:14,color:C.muted}},"completed"))
        ]),
        React.createElement("div",{key:"pb",style:{width:140}},React.createElement(PBar,{value:done,max:all.length,color:done===all.length?C.green:C.accent}))
      ])
    ),
    ...ROUTINE.map(block=>
      React.createElement(Card,{key:block.time},
        [React.createElement("div",{key:"hd",style:{display:"flex",alignItems:"center",gap:10,marginBottom:12}},[
          React.createElement("div",{key:"t",style:{background:C.accent+"22",color:C.accent,padding:"3px 8px",borderRadius:5,fontFamily:"JetBrains Mono",fontSize:11,fontWeight:600}},block.time),
          React.createElement("div",{key:"l",style:{fontSize:13,fontWeight:700}},block.label)
        ]),
        ...block.items.map(item=>
          React.createElement("label",{key:item.key,style:{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginBottom:8,textTransform:"none",letterSpacing:0}},[
            React.createElement("input",{key:"cb",type:"checkbox",checked:!!r[item.key],onChange:()=>toggle(item.key),style:{accentColor:C.accent}}),
            React.createElement("span",{key:"lbl",style:{fontSize:13,color:r[item.key]?C.green:C.text}},item.label),
            r[item.key]&&React.createElement("span",{key:"ck",style:{fontSize:11,color:C.green}},"✓")
          ])
        )]
      )
    )
  ]);
}

// ── DAILY JOURNAL ──
function JournalPage({journal,setJournal}){
  const k=todayStr();const e=journal[k]||{};
  const set=(f,v)=>setJournal(p=>({...p,[k]:{...(p[k]||{}),[f]:v}}));
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}},[
    React.createElement(Card,{key:"top",style:{gridColumn:"1/-1"}},
      [React.createElement(CT,{key:"ct",icon:"📔",title:"Daily Journal",color:C.accent}),
      React.createElement("div",{key:"grid",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}},
        [["wakeUp","Wake Up Time","time"],["sleepTime","Planned Sleep","time"]].map(([f,l,t])=>
          React.createElement("div",{key:f},[
            React.createElement("label",{key:"lbl"},l),
            React.createElement("input",{key:"inp",type:t,value:e[f]||"",onChange:ev=>set(f,ev.target.value)})
          ])
        ).concat([
          React.createElement("div",{key:"mood"},[
            React.createElement("label",{key:"l"},"Mood (1-10)"),
            React.createElement("input",{key:"r",type:"range",min:1,max:10,value:e.mood||5,onChange:ev=>set("mood",+ev.target.value),style:{accentColor:C.accent}}),
            React.createElement("div",{key:"v",style:{textAlign:"center",color:C.accent,fontFamily:"JetBrains Mono",fontSize:13}},(e.mood||5)+"/10")
          ]),
          React.createElement("div",{key:"energy"},[
            React.createElement("label",{key:"l"},"Energy (1-10)"),
            React.createElement("input",{key:"r",type:"range",min:1,max:10,value:e.energy||5,onChange:ev=>set("energy",+ev.target.value),style:{accentColor:C.gold}}),
            React.createElement("div",{key:"v",style:{textAlign:"center",color:C.gold,fontFamily:"JetBrains Mono",fontSize:13}},(e.energy||5)+"/10")
          ]),
          React.createElement("div",{key:"sleep"},[
            React.createElement("label",{key:"l"},"Sleep Quality (1-10)"),
            React.createElement("input",{key:"r",type:"range",min:1,max:10,value:e.sleepQuality||5,onChange:ev=>set("sleepQuality",+ev.target.value),style:{accentColor:C.purple}}),
            React.createElement("div",{key:"v",style:{textAlign:"center",color:C.purple,fontFamily:"JetBrains Mono",fontSize:13}},(e.sleepQuality||5)+"/10")
          ])
        ])
      )]
    ),
    ...[["todayWins","🏆 Today's Wins",C.green],["todayMistakes","⚠️ Today's Mistakes",C.red],["lessonsLearned","💡 Lessons Learned",C.gold],["tomorrowFocus","🎯 Tomorrow's Focus",C.accent]].map(([f,l,c])=>
      React.createElement(Card,{key:f},[
        React.createElement(CT,{key:"ct",icon:l.split(" ")[0],title:l.split(" ").slice(1).join(" "),color:c}),
        React.createElement("textarea",{key:"ta",value:e[f]||"",onChange:ev=>set(f,ev.target.value),placeholder:"Write here..."})
      ])
    ),
    React.createElement(Card,{key:"time"},
      [React.createElement(CT,{key:"ct",icon:"⏱",title:"Time Tracker",color:C.accent}),
      ...[["tradingHours","Trading Hours"],["chineseHours","Chinese (hrs)"],["englishHours","English (hrs)"],["aiHours","AI/Business (hrs)"],["workoutHours","Workout (hrs)"],["socialHours","Social Media (hrs)"]].map(([f,l])=>
        React.createElement("div",{key:f,style:{marginBottom:10}},[
          React.createElement("label",{key:"lbl"},l),
          React.createElement("input",{key:"inp",type:"number",min:0,max:24,step:0.25,value:e[f]||"",onChange:ev=>set(f,+ev.target.value)})
        ])
      )]
    ),
    React.createElement(Card,{key:"nut"},
      [React.createElement(CT,{key:"ct",icon:"🥗",title:"Nutrition",color:C.green}),
      ...[["protein","Protein (g)"],["calories","Calories"],["water","Water (L)"]].map(([f,l])=>
        React.createElement("div",{key:f,style:{marginBottom:10}},[
          React.createElement("label",{key:"l"},l),
          React.createElement("input",{key:"i",type:"number",min:0,value:e[f]||"",onChange:ev=>set(f,+ev.target.value)})
        ])
      ),
      React.createElement("div",{key:"checks",style:{display:"flex",gap:12,marginTop:8}},
        [["proteinGoal","Protein Goal ✓"],["caloriesGoal","Calories Goal ✓"]].map(([f,l])=>
          React.createElement("label",{key:f,style:{display:"flex",alignItems:"center",gap:6,cursor:"pointer",textTransform:"none",letterSpacing:0,flex:1}},[
            React.createElement("input",{key:"cb",type:"checkbox",checked:!!e[f],onChange:ev=>set(f,ev.target.checked),style:{accentColor:C.green}}),
            React.createElement("span",{key:"s",style:{fontSize:12,color:e[f]?C.green:C.muted}},l)
          ])
        )
      )]
    )
  ]);
}

// ── FOOD JOURNAL ──
function FoodPage({food,setFood}){
  const k=todayStr();const e=food[k]||{};
  const set=(f,v)=>setFood(p=>({...p,[k]:{...(p[k]||{}),[f]:v}}));
  const nc=e.proteinGoal&&e.caloriesGoal&&(e.healthyMeals||0)>=3?{color:C.green,label:"🟢 Great Nutrition Day"}:
           e.proteinGoal||e.caloriesGoal?{color:C.yellow,label:"🟡 Average Nutrition Day"}:{color:C.red,label:"🔴 Poor Nutrition Day"};
  const handlePhoto=(meal,file)=>{if(!file)return;const r=new FileReader();r.onload=ev=>set(meal+"Photo",ev.target.result);r.readAsDataURL(file);};
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}},[
    React.createElement(Card,{key:"hdr",style:{gridColumn:"1/-1"}},
      [React.createElement("div",{key:"top",style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},[
        React.createElement(CT,{key:"ct",icon:"🍽️",title:"Food Journal",color:C.green}),
        React.createElement(Pill,{key:"pill",color:nc.color},nc.label)
      ]),
      React.createElement("div",{key:"grid",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12}},
        [["protein","Protein (g)"],["calories","Calories"],["water","Water (L)"],["healthyMeals","Healthy Meals"]].map(([f,l])=>
          React.createElement("div",{key:f},[React.createElement("label",{key:"l"},l),React.createElement("input",{key:"i",type:"number",min:0,value:e[f]||"",onChange:ev=>set(f,+ev.target.value)})])
        )
      ),
      React.createElement("div",{key:"checks",style:{display:"flex",gap:16,marginTop:12}},
        [["proteinGoal","Protein Goal"],["caloriesGoal","Calories Goal"]].map(([f,l])=>
          React.createElement("label",{key:f,style:{display:"flex",alignItems:"center",gap:8,cursor:"pointer",textTransform:"none",letterSpacing:0}},[
            React.createElement("input",{key:"cb",type:"checkbox",checked:!!e[f],onChange:ev=>set(f,ev.target.checked),style:{accentColor:C.green}}),
            React.createElement("span",{key:"s",style:{fontSize:13,color:e[f]?C.green:C.muted}},l+": "),
            React.createElement("strong",{key:"v",style:{color:e[f]?C.green:C.red}},e[f]?"YES":"NO")
          ])
        )
      )]
    ),
    ...[["breakfast","🌅 Breakfast",C.gold],["lunch","☀️ Lunch",C.accent],["dinner","🌙 Dinner",C.purple],["snacks","🍎 Snacks",C.green]].map(([meal,label,color])=>
      React.createElement(Card,{key:meal},[
        React.createElement(CT,{key:"ct",icon:label.split(" ")[0],title:label.split(" ")[1],color}),
        React.createElement("textarea",{key:"ta",placeholder:"What did you eat?",value:e[meal]||"",onChange:ev=>set(meal,ev.target.value)}),
        React.createElement("div",{key:"photo",style:{marginTop:10}},[
          React.createElement("label",{key:"l"},"Photo"),
          React.createElement("input",{key:"i",type:"file",accept:"image/*",onChange:ev=>handlePhoto(meal,ev.target.files[0])}),
          e[meal+"Photo"]&&React.createElement("img",{key:"img",src:e[meal+"Photo"],style:{width:"100%",borderRadius:8,marginTop:8,maxHeight:180,objectFit:"cover"}})
        ])
      ])

// ── ANALYTICS ──
function AnalyticsPage({journal,routine,fitness,trades,food}){
  const days30=Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(29-i));return d.toISOString().split("T")[0];});
  const days7=days30.slice(-7);
  const wScores=days7.map(k=>({name:k.slice(5),score:calcScore(routine[k]||{},journal[k]||{})}));
  const habits=[
    {name:"Prayer",val:days30.filter(k=>routine[k]?.prayer).length},
    {name:"Bible",val:days30.filter(k=>routine[k]?.bibleReading).length},
    {name:"Workout",val:days30.filter(k=>routine[k]?.weights||routine[k]?.cardio).length},
    {name:"Trading",val:days30.filter(k=>routine[k]?.tradingStudy).length},
    {name:"Chinese",val:days30.filter(k=>routine[k]?.chineseStudy).length},
    {name:"English",val:days30.filter(k=>routine[k]?.englishStudy).length},
    {name:"Protein",val:days30.filter(k=>journal[k]?.proteinGoal).length},
  ];
  const best=[...habits].sort((a,b)=>b.val-a.val)[0];
  const worst=[...habits].sort((a,b)=>a.val-b.val)[0];
  const food7=days7.map(k=>food[k]||{});
  const greenDays=food7.filter(f=>f.proteinGoal&&f.caloriesGoal&&(f.healthyMeals||0)>=3).length;
  const redDays=food7.filter(f=>!f.proteinGoal&&!f.caloriesGoal).length;
  const yellowDays=7-greenDays-redDays;
  const nutScore=Math.round((greenDays/7)*100);
  // Heatmap
  const heatDays=Array.from({length:91},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(90-i));
    const k=d.toISOString().split("T")[0];
    const r=routine[k]||{};const j=journal[k]||{};
    let score=0;
    if(r.prayer)score++;if(r.bibleReading)score++;if(r.weights||r.cardio)score++;
    if(r.tradingStudy)score++;if(r.chineseStudy)score++;if(j.proteinGoal)score++;
    return{date:k,score,day:d.getDay(),week:Math.floor(i/7)};
  });
  const heatColors=["#1a2030","#003d1f","#006636","#00a354",C.green];
  return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}},[
    React.createElement(Card,{key:"wscore",style:{gridColumn:"1/-1"}},
      [React.createElement(CT,{key:"ct",icon:"📊",title:"Daily Score — Last 7 Days",color:C.accent}),
      React.createElement("div",{key:"c",style:{height:160}},
        React.createElement(ResponsiveContainer,{width:"100%",height:"100%"},
          React.createElement(BarChart,{data:wScores},[
            React.createElement(Bar,{key:"b",dataKey:"score",fill:C.accent,radius:[4,4,0,0]}),
            React.createElement(XAxis,{key:"x",dataKey:"name",tick:{fill:C.muted,fontSize:11},axisLine:false,tickLine:false}),
            React.createElement(YAxis,{key:"y",tick:{fill:C.muted,fontSize:11},axisLine:false,tickLine:false,domain:[0,100]}),
            React.createElement(Tooltip,{key:"t",contentStyle:{background:C.card,border:"1px solid "+C.border,borderRadius:8}})
          ])
        )
      )]
    ),
    React.createElement(Card,{key:"habits"},
      [React.createElement(CT,{key:"ct",icon:"✅",title:"Habit Completion — 30 Days",color:C.green}),
      habits.map(h=>
        React.createElement(PBar,{key:h.name,label:h.name+" ("+h.val+"/30)",value:h.val,max:30,color:h.val>=20?C.green:h.val>=10?C.yellow:C.red})
      )]
    ),
    React.createElement(Card,{key:"growth"},
      [React.createElement(CT,{key:"ct",icon:"🔍",title:"Personal Growth",color:C.gold}),
      [
        {label:"Best Habit This Month",val:best?.name,color:C.green,icon:"🏆"},
        {label:"Needs Improvement",val:worst?.name,color:C.red,icon:"⚠️"},
      ].map(item=>
        React.createElement("div",{key:item.label,style:{padding:"12px 16px",background:item.color+"11",borderLeft:"3px solid "+item.color,borderRadius:4,marginBottom:12}},[
          React.createElement("div",{key:"l",style:{fontSize:11,color:C.muted,marginBottom:4}},item.label),
          React.createElement("div",{key:"v",style:{fontSize:18,fontWeight:800,color:item.color}},item.icon+" "+(item.val||"—"))
        ])
      )]
    ),
    React.createElement(Card,{key:"food"},
      [React.createElement(CT,{key:"ct",icon:"🥗",title:"Weekly Nutrition Report",color:C.green}),
      React.createElement("div",{key:"boxes",style:{display:"flex",gap:12,marginBottom:16}},
        [["🟢 Green",greenDays,C.green],["🟡 Yellow",yellowDays,C.yellow],["🔴 Red",redDays,C.red]].map(([l,v,c])=>
          React.createElement("div",{key:l,style:{flex:1,textAlign:"center",padding:"10px 8px",background:c+"11",borderRadius:8,border:"1px solid "+c+"33"}},[
            React.createElement("div",{key:"n",style:{fontSize:20,fontWeight:800,color:c,fontFamily:"JetBrains Mono"}},v),
            React.createElement("div",{key:"l",style:{fontSize:10,color:C.muted}},l+" Days")
          ])
        )
      ),
      React.createElement(PBar,{key:"pb",label:"Weekly Score: "+nutScore+"%",value:nutScore,max:100,color:nutScore>=70?C.green:nutScore>=40?C.yellow:C.red})]
    ),
    React.createElement(Card,{key:"heatmap",style:{gridColumn:"1/-1"}},
      [React.createElement(CT,{key:"ct",icon:"🔥",title:"Life Heatmap — Last 13 Weeks",color:C.accent}),
      React.createElement("div",{key:"wrap",style:{overflowX:"auto"}},
        [React.createElement("div",{key:"grid",style:{display:"flex",gap:3}},
          Array.from({length:13},(_,w)=>
            React.createElement("div",{key:w,style:{display:"flex",flexDirection:"column",gap:3}},
              Array.from({length:7},(_,d)=>{
                const cell=heatDays.find(h=>h.week===w&&h.day===d);
                const s=cell?.score||0;
                return React.createElement("div",{key:d,title:cell?.date||"",style:{width:14,height:14,borderRadius:3,background:heatColors[Math.min(s,4)],border:"1px solid "+C.border+"22"}});
              })
            )
          )
        ),
        React.createElement("div",{key:"legend",style:{display:"flex",gap:4,marginTop:8,alignItems:"center"}},
          [React.createElement("span",{key:"less",style:{fontSize:10,color:C.muted}},"Less"),
          ...heatColors.map((c,i)=>React.createElement("div",{key:i,style:{width:12,height:12,borderRadius:2,background:c}})),
          React.createElement("span",{key:"more",style:{fontSize:10,color:C.muted}},"More")]
        )]
      )]
    )
  ]);
}
